; PlatformIO configuration for the Portable qPCR firmware.
;
; Layout (issue #3):
;   firmware/lib/core      board-agnostic control core (no hardware calls)
;   firmware/lib/fakes     fake hardware for host tests
;   firmware/targets/<b>   one folder per board; selected with build_src_filter
;   firmware/test          host (native) unit tests
;
; Every environment embeds the version from version.txt as FIRMWARE_VERSION.

[platformio]
default_envs = esp32-p4
src_dir = firmware/targets
lib_dir = firmware/lib
test_dir = firmware/test

[env]
build_flags = -std=gnu++17 -Wall -Wextra
extra_scripts = pre:scripts/version_flags.py
; Static analysis (issue #20) runs from scripts/lint-gate.sh and CI with the uv-managed
; clang-format, clang-tidy and cppcheck, directly on the firmware sources (not .pio/libdeps).

; Host build: runs the core's unit tests on the development machine.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
; Warnings are errors on the host build, and the tests run under AddressSanitizer and
; UndefinedBehaviorSanitizer (issue #20).
build_flags =
    ${env.build_flags}
    -Werror
    -DQPCR_NATIVE
    -DUNITY_INCLUDE_DOUBLE
    -DQPCR_PROJECT_DIR='"$PROJECT_DIR"'
    -fsanitize=address,undefined
    -fno-omit-frame-pointer

; Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5 development board (decision LI-DL-004, issue #2).
[env:esp32-p4]
; Pinned pioarduino release (Arduino core 3.3.12, ESP-IDF 5.5.5) instead of the floating
; "stable" zip, so local and CI builds are identical. 55.03.311+ carries the ESP32-P4 rev3 fix.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; esp32-p4_r3 selects the rev 3.x library profile (Arduino "ChipVariant=postv3"). The plain
; esp32-p4 board targets engineering-sample silicon (rev 1.x, profile esp32p4_es, REV_MAX 1.99);
; production boards such as the Waveshare Touch-LCD-3.5 ship rev 3.x (ECO7, v3.2), whose
; bootloader refuses a rev 1.x image and lets the LP watchdog reset the chip every 3 s. Check
; the chip with `esptool chip-id` before switching board.
board = esp32-p4_r3
framework = arduino
board_build.mcu = esp32p4
; CPU clock comes from the board definition: 400 MHz on rev 3.x silicon (esp32-p4_r3). Rev 1.x
; silicon (board esp32-p4) only supports 360 MHz; the core rejects the other value at boot.
build_src_filter = +<esp32-p4/>
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    ; Serial on UART0 (GPIO37/38, the board's Type-C UART bridge) so `pio device monitor`
    ; shows the firmware's prints on the same port used for flashing. Set to 1 to move
    ; Serial to the P4's native USB CDC instead.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; LVGL reads its configuration from firmware/targets/esp32-p4/lv_conf.h (issue #11).
    -D LV_CONF_PATH=${PROJECT_DIR}/firmware/targets/esp32-p4/lv_conf.h
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.7
    lvgl/lvgl @ ^9.2.2
monitor_speed = 115200
