name: Build

# Static analysis, host unit tests and a build of every PlatformIO environment on every
# push to main and every pull request. Python tooling (PlatformIO, clang-format,
# clang-tidy, cppcheck) is installed by uv from uv.lock, so CI and the local gate
# (scripts/lint-gate.sh) run identical versions. The "Build" jobs are the required status
# checks for main (see .cursor/rules/pre-pr-quality-gate.mdc).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis (clang-format, clang-tidy, cppcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: clang-format
        run: |
          mapfile -t files < <(git ls-files 'firmware/**/*.cpp' 'firmware/**/*.h' 'firmware/**/*.hpp')
          uv run clang-format --dry-run -Werror "${files[@]}"
      - name: clang-tidy (core, host flags)
        run: |
          mapfile -t files < <(git ls-files 'firmware/lib/**/*.cpp' 'firmware/lib/**/*.h')
          uv run clang-tidy --quiet "${files[@]}" -- -std=gnu++17 -x c++ -Ifirmware/lib/core/include -Ifirmware/lib/fakes/include
      - name: cppcheck
        run: |
          uv run cppcheck --enable=warning,style,performance,portability --inline-suppr \
            --suppressions-list=.cppcheck-suppressions --std=c++17 --error-exitcode=1 --quiet \
            -Ifirmware/lib/core/include -Ifirmware/lib/fakes/include \
            firmware/lib firmware/targets firmware/test

  test-native:
    name: Host unit tests (native)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini', 'uv.lock') }}
      - run: uv sync --frozen
      - name: Replay data matches the Klipper originals
        if: hashFiles('firmware/tools/klipper_reference/replay.py') != ''
        run: uv run python -I firmware/tools/klipper_reference/replay.py --check
      - name: Unit tests (ASan + UBSan, warnings as errors)
        run: uv run pio test -e native

  build-firmware:
    name: Build firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-p4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ runner.os }}-${{ hashFiles('platformio.ini', 'uv.lock') }}
      - run: uv sync --frozen
      - name: Build
        run: uv run pio run -e ${{ matrix.env }}
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
