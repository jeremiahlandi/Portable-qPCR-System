name: Build

# Builds every PlatformIO environment and runs the host unit tests on every
# push to main and every pull request. The "Build" check is the required
# status check for main (see .cursor/rules/pre-pr-quality-gate.mdc).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis (clang-format, clang-tidy, cppcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18 clang-tidy-18
      - run: pip install --upgrade platformio
      - name: clang-format
        run: |
          mapfile -t files < <(git ls-files 'firmware/**/*.cpp' 'firmware/**/*.h' 'firmware/**/*.hpp')
          clang-format-18 --dry-run -Werror "${files[@]}"
      - name: clang-tidy (core, host flags)
        run: |
          mapfile -t files < <(git ls-files 'firmware/lib/**/*.cpp' 'firmware/lib/**/*.h')
          clang-tidy-18 --quiet "${files[@]}" -- -std=gnu++17 -x c++ -Ifirmware/lib/core/include -Ifirmware/lib/fakes/include
      - name: cppcheck (pio check)
        run: pio check --fail-on-defect=high --fail-on-defect=medium

  test-native:
    name: Host unit tests (native)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install --upgrade platformio
      - name: Unit tests (ASan + UBSan, warnings as errors)
        run: pio test -e native

  build-firmware:
    name: Build firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-p4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install --upgrade platformio
      - name: Build
        run: pio run -e ${{ matrix.env }}
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
